<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Hosting Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1a1d23;
            --bg-card: #252932;
            --bg-hover: #2d3139;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --border: #3a3f4a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ea580c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: var(--bg-card);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Servers */
        .servers-section {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        /* Button */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Server Card */
        .server-card {
            background: var(--bg-hover);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .server-name {
            font-size: 18px;
            font-weight: 600;
        }

        .server-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-running {
            background: rgba(22, 163, 74, 0.2);
            color: var(--success);
        }

        .status-stopped {
            background: rgba(220, 38, 38, 0.2);
            color: var(--danger);
        }

        .server-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: var(--bg-dark);
            border-radius: 6px;
        }

        .info-item {
            font-size: 13px;
        }

        .info-label {
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .server-actions {
            display: flex;
            gap: 10px;
        }

        /* Console */
        .console {
            background: #000;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .console.active {
            display: block;
        }

        .console-line {
            margin-bottom: 4px;
            color: #0f0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🖥️ Laptop Hosting Panel</h1>
            <div>
                <button class="btn btn-primary" onclick="openCreateModal()">+ Создать сервер</button>
            </div>
        </header>

        <!-- System Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>CPU Usage</h3>
                <div class="value" id="cpuUsage">0%</div>
                <div class="label">из 100%</div>
            </div>
            <div class="stat-card">
                <h3>Memory</h3>
                <div class="value" id="memoryUsage">0 GB</div>
                <div class="label" id="memoryTotal">из 0 GB</div>
            </div>
            <div class="stat-card">
                <h3>Network In</h3>
                <div class="value" id="networkIn">0 KB/s</div>
                <div class="label">Входящий трафик</div>
            </div>
            <div class="stat-card">
                <h3>Network Out</h3>
                <div class="value" id="networkOut">0 KB/s</div>
                <div class="label">Исходящий трафик</div>
            </div>
        </div>

        <!-- Servers -->
        <div class="servers-section">
            <div class="section-header">
                <h2>Серверы</h2>
            </div>
            <div id="serversList">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Create Server Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2>Создать сервер</h2>
            <form id="createForm" onsubmit="createServer(event)">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Команда запуска</label>
                    <input type="text" name="command" required placeholder="java -jar server.jar">
                </div>
                <div class="form-group">
                    <label>Рабочая директория</label>
                    <input type="text" name="working_dir" required placeholder="/home/user/servers/my-server">
                </div>
                <div class="form-group">
                    <label>Порт (опционально)</label>
                    <input type="number" name="port">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeCreateModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let socket = null;
        let lastNetworkStats = { bytes_sent: 0, bytes_recv: 0, timestamp: Date.now() };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadServers();
            connectWebSocket();
            setInterval(loadServers, 5000); // Refresh every 5 seconds
        });

        // WebSocket Connection
        function connectWebSocket() {
            socket = io('http://localhost:5000');
            
            socket.on('connect', () => {
                console.log('WebSocket connected');
                socket.emit('subscribe_stats');
            });

            socket.on('stats_update', (stats) => {
                updateSystemStats(stats);
            });

            socket.on('disconnect', () => {
                console.log('WebSocket disconnected');
            });
        }

        // Load Servers
        async function loadServers() {
            try {
                const response = await fetch(`${API_URL}/servers`);
                const servers = await response.json();
                
                renderServers(servers);
            } catch (error) {
                console.error('Error loading servers:', error);
            }
        }

        // Render Servers
        function renderServers(servers) {
            const container = document.getElementById('serversList');
            
            if (servers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Нет серверов</h3>
                        <p>Создайте свой первый сервер!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = servers.map(server => `
                <div class="server-card">
                    <div class="server-header">
                        <div class="server-name">${server.name}</div>
                        <div class="server-status ${server.is_running ? 'status-running' : 'status-stopped'}">
                            ${server.is_running ? 'Запущен' : 'Остановлен'}
                        </div>
                    </div>
                    <div class="server-info">
                        <div class="info-item">
                            <div class="info-label">CPU</div>
                            <div>${server.stats.cpu.toFixed(1)}%</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Memory</div>
                            <div>${formatBytes(server.stats.memory)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Uptime</div>
                            <div>${formatUptime(server.stats.uptime)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Port</div>
                            <div>${server.port || 'N/A'}</div>
                        </div>
                    </div>
                    <div class="server-actions">
                        ${server.is_running ? `
                            <button class="btn btn-small btn-danger" onclick="stopServer('${server.id}')">Стоп</button>
                            <button class="btn btn-small btn-primary" onclick="restartServer('${server.id}')">Рестарт</button>
                        ` : `
                            <button class="btn btn-small btn-success" onclick="startServer('${server.id}')">Старт</button>
                        `}
                        <button class="btn btn-small" onclick="toggleConsole('${server.id}')">Консоль</button>
                        <button class="btn btn-small btn-danger" onclick="deleteServer('${server.id}')">Удалить</button>
                    </div>
                    <div class="console" id="console-${server.id}"></div>
                </div>
            `).join('');
        }

        // Server Actions
        async function startServer(id) {
            try {
                await fetch(`${API_URL}/servers/${id}/start`, { method: 'POST' });
                loadServers();
            } catch (error) {
                console.error('Error starting server:', error);
            }
        }

        async function stopServer(id) {
            try {
                await fetch(`${API_URL}/servers/${id}/stop`, { method: 'POST' });
                loadServers();
            } catch (error) {
                console.error('Error stopping server:', error);
            }
        }

        async function restartServer(id) {
            try {
                await fetch(`${API_URL}/servers/${id}/restart`, { method: 'POST' });
                loadServers();
            } catch (error) {
                console.error('Error restarting server:', error);
            }
        }

        async function deleteServer(id) {
            if (!confirm('Вы уверены, что хотите удалить этот сервер?')) return;
            
            try {
                await fetch(`${API_URL}/servers/${id}`, { method: 'DELETE' });
                loadServers();
            } catch (error) {
                console.error('Error deleting server:', error);
            }
        }

        async function toggleConsole(id) {
            const console = document.getElementById(`console-${id}`);
            console.classList.toggle('active');
            
            if (console.classList.contains('active')) {
                const response = await fetch(`${API_URL}/servers/${id}/console?lines=50`);
                const data = await response.json();
                
                console.innerHTML = data.output.map(line => 
                    `<div class="console-line">${escapeHtml(line)}</div>`
                ).join('');
            }
        }

        // Create Server
        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('createForm').reset();
        }

        async function createServer(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {
                name: formData.get('name'),
                command: formData.get('command'),
                working_dir: formData.get('working_dir'),
                port: formData.get('port') ? parseInt(formData.get('port')) : null,
                auto_start: false
            };

            try {
                await fetch(`${API_URL}/servers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                closeCreateModal();
                loadServers();
            } catch (error) {
                console.error('Error creating server:', error);
            }
        }

        // Update System Stats
        function updateSystemStats(stats) {
            // CPU
            document.getElementById('cpuUsage').textContent = `${stats.cpu.usage.toFixed(1)}%`;

            // Memory
            const memoryGB = (stats.memory.used / 1024 / 1024 / 1024).toFixed(1);
            const totalGB = (stats.memory.total / 1024 / 1024 / 1024).toFixed(1);
            document.getElementById('memoryUsage').textContent = `${memoryGB} GB`;
            document.getElementById('memoryTotal').textContent = `из ${totalGB} GB`;

            // Network
            const now = Date.now();
            const timeDiff = (now - lastNetworkStats.timestamp) / 1000; // seconds

            if (timeDiff > 0) {
                const bytesInDiff = stats.network.bytes_recv - lastNetworkStats.bytes_recv;
                const bytesOutDiff = stats.network.bytes_sent - lastNetworkStats.bytes_sent;

                const inSpeed = bytesInDiff / timeDiff;
                const outSpeed = bytesOutDiff / timeDiff;

                document.getElementById('networkIn').textContent = formatSpeed(inSpeed);
                document.getElementById('networkOut').textContent = formatSpeed(outSpeed);
            }

            lastNetworkStats = {
                bytes_sent: stats.network.bytes_sent,
                bytes_recv: stats.network.bytes_recv,
                timestamp: now
            };
        }

        // Utilities
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatSpeed(bytesPerSecond) {
            return formatBytes(bytesPerSecond) + '/s';
        }

        function formatUptime(seconds) {
            if (!seconds) return '0s';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${secs}s`;
            return `${secs}s`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</body>
</html>
